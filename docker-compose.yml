services:
  frc-elo-app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS}
      USE_SECURE_COOKIES: ${USE_SECURE_COOKIES:-false}
    ports:
      # Nur auf localhost gebunden — von außen läuft alles über
      # nginx-proxy-manager (https://elo.1frc.de), der den Container
      # direkt über das Docker-Netz erreicht.
      - "127.0.0.1:8080:3000"
    networks:
      - frcspieldaten_default
      - nginx-proxy-manager_default

networks:
  frcspieldaten_default:
    external: true
  nginx-proxy-manager_default:
    external: true
